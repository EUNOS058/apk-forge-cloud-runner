name: APK Forge Cloud Build Engine

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework Engine (react-native, expo, flutter, pwa)'
        required: true
        default: 'expo'
      app_name:
        description: 'Application Display Name'
        required: true
        default: 'MyAwesomeApp'
      package_name:
        description: 'Android Package Name / ID'
        required: false
        default: 'com.apkforge.app'
      build_tag:
        description: 'Unique Build Tag ID'
        required: true
        default: 'build-001'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract Source ZIP Archive
        run: |
          mkdir -p workspace_extracted
          unzip -q "builds/${{ inputs.build_tag }}.zip" -d workspace_extracted || cp -R . workspace_extracted/
      - name: Ensure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
      - name: Build APK Based on Framework
        run: |
          cd workspace_extracted
          if [ "${{ inputs.framework }}" = "expo" ]; then
            npm install && npx expo prebuild --platform android && cd android && ./gradlew assembleDebug
          elif [ "${{ inputs.framework }}" = "flutter" ]; then
            flutter pub get && flutter build apk --debug
          else
            npm install && cd android && ./gradlew assembleDebug
          fi
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: /**/*.apk
