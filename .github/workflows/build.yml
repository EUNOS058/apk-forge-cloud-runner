name: APK Forge Cloud Build Engine

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework Engine'
        required: true
        default: 'pwa'
        type: choice
        options:
          - pwa
          - html
          - react-native
          - expo
          - flutter
      app_name:
        description: 'Application Display Name'
        required: true
        default: 'MyAwesomeApp'
      package_name:
        description: 'Android Package Name'
        required: true
        default: 'com.apkforge.app'
      build_tag:
        description: 'Unique Build Tag'
        required: false
        default: 'build-001'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create WebView Android Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PACKAGE_
