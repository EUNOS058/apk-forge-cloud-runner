name: APK Forge Cloud Build Engine

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework Engine (react-native, expo, flutter, pwa)'
        required: true
        default: 'expo'
      app_name:
        description: 'Application Display Name'
        required: true
        default: 'MyAwesomeApp'
      package_name:
        description: 'Android Package Name / ID'
        required: false
        default: 'com.apkforge.app'
      zip_url:
        description: 'Public URL of the uploaded source ZIP'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4

      - name: Free disk space and add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Download and extract source ZIP
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o source.zip
          mkdir -p project
          unzip -q source.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        if: ${{ github.event.inputs.framework == 'expo' || github.event.inputs.framework == 'react-native' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        if: ${{ github.event.inputs.framework == 'expo' || github.event.inputs.framework == 'react-native' }}
        working-directory: project
        run: npm install

      - name: Expo prebuild (generates native android/ folder)
        if: ${{ github.event.inputs.framework == 'expo' }}
        working-directory: project
        run: npx expo prebuild --platform android --non-interactive

      - name: Set up Flutter
        if: ${{ github.event.inputs.framework == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        if: ${{ github.event.inputs.framework == 'flutter' }}
        working-directory: project
        run: flutter pub get

      - name: Grant execute permission for gradlew
        if: ${{ github.event.inputs.framework != 'pwa' }}
        working-directory: project/android
        run: chmod +x gradlew

      - name: Build debug APK (Expo / React Native)
        if: ${{ github.event.inputs.framework == 'expo' || github.event.inputs.framework == 'react-native' }}
        working-directory: project/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
          ORG_GRADLE_PROJECT_newArchEnabled: "false"
        run: ./gradlew assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3072m"

      - name: Build debug APK (Flutter)
        if: ${{ github.event.inputs.framework == 'flutter' }}
        working-directory: project
        run: flutter build apk --debug

      - name: Locate built APK
        id: locate
        run: |
          APK_PATH=$(find project -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 7
